name: Integration Tests 🧪
on:
  workflow_call:
    inputs:
      action-ref:
        description: 'The github-sponsors-readme-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v1'
    secrets:
      PAT:
        required: true
  workflow_dispatch:
    inputs:
      action-ref:
        description: 'The github-sponsors-readme-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v1'
  schedule:
    - cron: 30 15 * * 0-6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-sponsors-readme-action
          ref: ${{ inputs.action-ref || 'v1' }}
          path: action-under-test

      - name: Generate Sponsors 💖
        uses: ./action-under-test
        with:
          token: ${{ secrets.PAT }}
          file: '.github/TEST.md'

      - name: Generate Sponsors 💖
        uses: ./action-under-test
        with:
          token: ${{ secrets.PAT }}
          file: '.github/TEST.md'
          minimum: 500
          maximum: 999
          marker: 'silver'
          fallback: 'No sponsors at this level'

      - name: Generate Sponsors 💖
        uses: ./action-under-test
        with:
          token: ${{ secrets.PAT }}
          file: '.github/TEST.md'
          minimum: 1000
          marker: 'gold'
          fallback: 'No sponsors at this level'
